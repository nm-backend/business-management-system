# =============================================================================
# SkladPro — pytest Configuration
# =============================================================================

[pytest]
# Django settings module for tests (in-memory SQLite)
DJANGO_SETTINGS_MODULE = skladpro.test_settings

# Test discovery paths
testpaths = apps

# Python files matching test pattern
python_files = tests.py test_*.py *_tests.py

# Always show local variables in failures
addopts =
    --reuse-db
    --tb=short
    --no-header
    -p no:cacheprovider

# Markers for categorizing tests
markers =
    slow: Tests that are slow (e.g., integration, file I/O)
    api: API endpoint tests
    model: Model/unit tests
    rbac: Role-based access control tests
