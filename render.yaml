# Render Blueprint — деплой SkladPro одним нажатием (Render → New → Blueprint).
# Поднимает: web (Django+Channels/Daphne из Dockerfile) + PostgreSQL + Redis.
# SECRET_KEY генерируется автоматически; ALLOWED_HOSTS = домен сервиса.
services:
  - type: web
    name: skladpro
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/core/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true          # Render сгенерирует длинный случайный ключ
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: skladpro
          property: host             # автоматически = <name>.onrender.com
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }

  # Redis (Key Value) для Django Channels / WebSocket.
  - type: redis
    name: skladpro-redis
    plan: free
    ipAllowList: []                  # только внутренняя сеть Render

  # ── Celery worker: автобэкап БД, фоновые задачи ──────────────────────────
  # Без него backups/tasks.py молча не выполняются (периодические бэкапы,
  # уведомления). SKIP_INIT=1 — миграции/статику делает web при старте.
  - type: worker
    name: skladpro-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A skladpro worker -l info
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: SKIP_INIT
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: worker.internal
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }

  # ── Celery beat: расписание периодических задач (автобэкап) ──────────────
  - type: worker
    name: skladpro-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A skladpro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: SKIP_INIT
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: beat.internal
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }

  # ── ОПЦИОНАЛЬНО: ежедневное уведомление о просроченных долгах ──────────────
  # Раскомментируйте, чтобы Render по расписанию запускал команду
  # `notify_overdue_debts` (создаёт уведомления OVERDUE_DEBT владельцу/админам).
  # ВНИМАНИЕ: Render Cron Jobs могут требовать платный план — на free это может
  # не примениться. Оставлено закомментированным, чтобы не сорвать деплой web.
  # - type: cron
  #   name: skladpro-overdue-debts
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   schedule: "0 6 * * *"            # ежедневно 06:00 UTC
  #   dockerCommand: python manage.py notify_overdue_debts
  #   envVars:
  #     - key: DJANGO_ENV
  #       value: production
  #     - key: DEBUG
  #       value: "False"
  #     - key: SKIP_INIT               # cron не мигрирует/не собирает статику
  #       value: "1"
  #     - key: SECURE_SSL_REDIRECT
  #       value: "False"
  #     - key: SECRET_KEY
  #       generateValue: true
  #     - key: ALLOWED_HOSTS
  #       value: cron.internal         # командой не используется, но нужен settings
  #     - key: DB_HOST
  #       fromDatabase: { name: skladpro-db, property: host }
  #     - key: DB_PORT
  #       fromDatabase: { name: skladpro-db, property: port }
  #     - key: DB_NAME
  #       fromDatabase: { name: skladpro-db, property: database }
  #     - key: DB_USER
  #       fromDatabase: { name: skladpro-db, property: user }
  #     - key: DB_PASSWORD
  #       fromDatabase: { name: skladpro-db, property: password }

databases:
  - name: skladpro-db
    plan: free
    databaseName: skladpro
    postgresMajorVersion: "16"
