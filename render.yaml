# ── SkladPro.Nod — Render Blueprint ──────────────────────────────────────────
# Деплой: Render → New → Blueprint → выбрать этот файл.
#
# ПЕРЕД ДЕПЛОЕМ создайте Environment Group "skladpro-secrets" в Render Dashboard:
#   Render → Environment Groups → New Group → "skladpro-secrets"
#   Добавьте: SECRET_KEY (сгенерируйте длинный случайный ключ)
#
# Все сервисы ссылаются на эту группу — SECRET_KEY общий для web, worker и beat.
# Без этого JWT-токены, подписанные web, невалидны в worker/beat.
#
# После деплоя 확인ите:
#   1. Health check: https://<ваш-домен>/api/v1/core/health/ → 200
#   2. Admin: https://<ваш-домен>/admin/
#   3. Создайте суперадмина: https://<ваш-домен>/accounts/setup/

services:
  # ── Web: Django + Daphne (ASGI для WebSocket) ──
  - type: web
    name: skladpro
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/core/health/
    autoDeploy: true
    envVars:
      - fromGroup: skladpro-secrets
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_SERVE
        value: "True"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: skladpro
          property: host
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }
      # Media Storage: раскомментируйте и задайте S3/R2 credentials
      # для сохранения фото при redeploy. Без этого фото эфемерны.
      # - key: AWS_STORAGE_BUCKET_NAME
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_S3_ENDPOINT_URL
      #   sync: false
      # - key: AWS_S3_REGION_NAME
      #   sync: false

  # ── PostgreSQL ──
  databases:
    - name: skladpro-db
      plan: free
      databaseName: skladpro
      postgresMajorVersion: "16"

  # ── Redis: Channel Layer + Celery Broker ──
  - type: redis
    name: skladpro-redis
    plan: free
    ipAllowList: []

  # ── Celery Worker: фоновые задачи (бэкап, подписки, уведомления) ──
  - type: worker
    name: skladpro-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A skladpro worker -l info --concurrency=2
    envVars:
      - fromGroup: skladpro-secrets
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SKIP_INIT
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: ALLOWED_HOSTS
        value: "worker.internal"
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }

  # ── Celery Beat: планировщик periodic tasks (DatabaseScheduler) ──
  - type: worker
    name: skladpro-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A skladpro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - fromGroup: skladpro-secrets
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SKIP_INIT
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: ALLOWED_HOSTS
        value: "beat.internal"
      - key: DB_HOST
        fromDatabase: { name: skladpro-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: skladpro-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: skladpro-db, property: database }
      - key: DB_USER
        fromDatabase: { name: skladpro-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: skladpro-db, property: password }
      - key: REDIS_URL
        fromService: { type: redis, name: skladpro-redis, property: connectionString }
