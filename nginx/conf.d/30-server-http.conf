# =============================================================================
# SkladPro — HTTP Server (Port 80)
#
# Serves ACME challenge for Let's Encrypt, healthcheck endpoint,
# and redirects everything else to HTTPS.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;          # catch-all — DNS resolved separately

    # ---- ACME challenge (Let's Encrypt) — must be accessible on port 80 ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # ---- Healthcheck (no rate limit, no auth) ----
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- Everything else → permanent HTTPS redirect ----
    location / {
        return 301 https://$host$request_uri;
    }
}
