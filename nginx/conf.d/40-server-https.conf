# =============================================================================
# SkladPro — HTTPS Server (Port 443)
#
# Full production server with SSL/TLS, security headers,
# static/media serving, API proxying, and WebSocket support.
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;          # catch-all — cert symlinked to fixed path

    charset utf-8;

    # ==================== SSL/TLS ====================

    # Certificate chain (symlinked to fixed path by certbot-init)
    ssl_certificate     /etc/letsencrypt/live/skladpro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skladpro/privkey.pem;

    # Protocol & ciphers (Mozilla Intermediate, 2024)
    # Single line — nginx does NOT support \ line continuation.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # DH params (generated at first deploy)
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==================== Security Headers ====================

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ==================== Locations ====================

    # ---- Healthcheck ----
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- Static files (served directly by nginx, cached aggressively) ----
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Media files (user uploads, served directly by nginx) ----
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Auth endpoints (tight rate limit — brute-force protection) ----
    location ~ ^/api/v1/accounts/(login|token/refresh|setup) {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://skladpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- General API endpoints (moderate rate limit) ----
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://skladpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # ---- Everything else (WebSocket support, general rate limit) ----
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://skladpro;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
