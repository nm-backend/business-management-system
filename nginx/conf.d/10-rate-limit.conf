# =============================================================================
# SkladPro — Rate Limiting Zones
#
# Zones are defined at http level so they can be used by any server block.
# =============================================================================

# General: 10 req/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Login/Auth: 5 req/min per IP (tight — brute-force protection)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# API: 30 req/min per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
