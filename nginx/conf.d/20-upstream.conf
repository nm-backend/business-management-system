# =============================================================================
# SkladPro — Upstream Backend (Daphne / Django ASGI)
# =============================================================================

upstream skladpro {
    # Least-connected — best for long-lived WebSocket connections
    least_conn;

    # Daphne on port 8000 inside the Docker network
    server web:8000 max_fails=3 fail_timeout=30s;
}
