# Railway build/deploy config (https://docs.railway.com/reference/config-as-code)
#
# ВАЖНО: без builder = "DOCKERFILE" Railway собирает проект своим Railpack,
# который запускает gunicorn (WSGI) и НЕ выполняет collectstatic. Последствия,
# воспроизведённые на боевом сервисе: WebSocket-чат не работает (sync-воркер не
# умеет ASGI), а вся статика отдаётся 404 ("No directory at: /app/staticfiles/").
# Наш Dockerfile запускает daphne (ASGI/Channels), а docker/entrypoint.sh
# применяет миграции и собирает статику перед стартом.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/core/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
