# Railway build config (https://docs.railway.com/reference/config-as-code)
#
# ВАЖНО: без builder = "DOCKERFILE" Railway собирает проект своим Railpack,
# который запускает gunicorn (WSGI) и НЕ выполняет collectstatic. Последствия,
# воспроизведённые на боевом сервисе: WebSocket-чат не работает (sync-воркер не
# умеет ASGI), а вся статика отдаётся 404 ("No directory at: /app/staticfiles/").
# Наш Dockerfile запускает daphne (ASGI/Channels), а docker/entrypoint.sh
# применяет миграции и собирает статику перед стартом.
#
# Здесь ТОЛЬКО [build]. Секции [deploy] быть не должно: этот файл общий для всех
# сервисов из репозитория, и healthcheckPath отсюда применялся к фоновому
# celery-worker'у. У воркера нет HTTP-порта, проверка не проходила, и Railway
# останавливал уже работающий контейнер ("1/1 replicas never became healthy!",
# при том что в логах было "celery@... ready"). Healthcheck и restart policy
# настраиваются на самом веб-сервисе.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
