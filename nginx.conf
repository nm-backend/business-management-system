# =============================================================================
# SkladPro — Main Nginx Configuration
#
# This file is intentionally minimal. All active configuration is
# organized into separate files under the conf.d/ directory:
#
#   00-basics.conf        MIME types, gzip, optimizations
#   10-rate-limit.conf    Rate limiting zones
#   20-upstream.conf      Backend upstream (Daphne)
#   30-server-http.conf   HTTP server (port 80) — ACME, redirect
#   40-server-https.conf  HTTPS server (port 443) — SSL, locations
#
# To add or modify behaviour, edit the relevant conf.d/ file
# rather than this file.
# =============================================================================

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Include all modular config files (alphabetical order)
    include /etc/nginx/conf.d/*.conf;
}
