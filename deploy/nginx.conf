# ── SkladPro.Nod — nginx для docker compose ──────────────────────────────────
# Схема: интернет → nginx (TLS) → daphne на 127.0.0.1:8000.
#
# Установка:
#   1) замените skladpro.example.com на свой домен (в двух местах);
#   2) положите файл в /etc/nginx/sites-available/skladpro.conf и включите:
#        ln -s /etc/nginx/sites-available/skladpro.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#   3) сертификат: см. deploy/README.md → «TLS».
#
# Важно: /media/ проксируется в Django, а не отдаётся с диска.
# Байты файлов выдаются только после проверки прав и компании пользователя
# (apps/core/media_views.py). alias/root на каталог media — утечка чужих файлов.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream skladpro_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name skladpro.example.com www.skladpro.example.com;

    # ACME-challenge должен отвечать по HTTP, иначе certbot не продлит сертификат.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://skladpro.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skladpro.example.com www.skladpro.example.com;

    ssl_certificate     /etc/letsencrypt/live/skladpro.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skladpro.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS выставляет Django (SECURE_HSTS_SECONDS), дублировать не нужно.
    server_tokens off;

    # Фото работ/чеков: Django ограничивает 10 МБ, прокси даёт запас на multipart.
    client_max_body_size 12m;

    access_log /var/log/nginx/skladpro.access.log;
    error_log  /var/log/nginx/skladpro.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Django читает этот заголовок (SECURE_PROXY_SSL_HEADER) для HTTPS-редиректа
    # и для secure-cookies. Без него получите петлю 301.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Health: без буферизации, чтобы проба видела ответ сразу ──
    location = /api/v1/core/health/ {
        proxy_pass http://skladpro_app;
        proxy_buffering off;
        access_log off;
    }

    # ── WebSocket (чат, realtime-уведомления) ──
    location /ws/ {
        proxy_pass http://skladpro_app;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Загруженные файлы: проверки прав внутри Django ──
    location /media/ {
        proxy_pass http://skladpro_app;
        proxy_read_timeout 120s;
    }

    # Опционально: отдача байтов самим nginx (X-Accel-Redirect).
    # Требует bind-mount media в хост и PROTECTED_MEDIA_ACCEL_LOCATION=/protected-media/.
    # location /protected-media/ {
    #     internal;
    #     alias /srv/skladpro/media/;
    # }

    # ── Статика: WhiteNoise внутри приложения ──
    location /static/ {
        proxy_pass http://skladpro_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://skladpro_app;
        proxy_read_timeout 120s;
    }
}
