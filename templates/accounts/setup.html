{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 32px 28px; text-align: center;">
        <!-- Brand mark -->
        <img src="{% static 'img/logo.svg' %}" alt="SkladPro" width="52" height="52"
             style="margin: 0 auto 12px; display: block;">
        <h2 style="font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variation-settings: 'SOFT' 60; margin-bottom: 4px;" data-i18n="app.name">SkladPro.Nod</h2>
        <p class="text-sm text-muted" style="margin-bottom: 24px;">
            <span data-i18n="auth.access_key_hint"></span>
        </p>

        <div id="error-message" class="alert-box" style="display: none;"></div>
        <div id="success-message" class="alert-box alert-success" style="display: none;" data-i18n="auth.activate"></div>

        <!-- Access Key: step 1 -- verify -->
        <div id="ak-panel">
            <form id="ak-verify-form">
                <div class="form-group" style="text-align: left;">
                    <label data-i18n="auth.access_key"></label>
                    <input type="text" id="ak-code" class="form-control" placeholder="SKP-XXXX-XXXX-XXXX"
                           autocomplete="one-time-code" required style="text-transform: uppercase; letter-spacing: 1px;">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.continue"></button>
            </form>

            <!-- Access Key: step 2 -- set password -->
            <form id="ak-redeem-form" style="display: none;">
                <p id="ak-welcome" style="margin-bottom: 12px; font-weight: 600; color: var(--primary);"></p>
                <div class="form-group" style="text-align: left;">
                    <label data-i18n="auth.set_password"></label>
                    <input type="password" id="ak-password" class="form-control" required minlength="8"
                           autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.activate"></button>
            </form>
        </div>

        <p class="text-xs text-muted" style="margin-top: 16px;">
            <span data-i18n="auth.access_key_admin_hint"></span>
        </p>

        <div style="margin-top: 24px;">
            <select id="lang-select" class="form-control" style="width: auto;">
                <option value="uz_cyrl">Ўзбекча</option>
                <option value="ru">Русский</option>
                <option value="ky">Кыргызча</option>
            </select>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ request.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const t = (k) => window.i18n.translate(k);
    const langSelect = document.getElementById('lang-select');
    langSelect.value = window.i18n.currentLang;
    langSelect.addEventListener('change', (e) => window.i18n.setLanguage(e.target.value));

    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');
    const verifyForm = document.getElementById('ak-verify-form');
    const redeemForm = document.getElementById('ak-redeem-form');
    const showError = (msg) => { errorMsg.textContent = msg; errorMsg.style.display = 'flex'; };
    const clearError = () => { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; };

    // Step 1: Verify access key
    verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        successMsg.style.display = 'none';
        const vBtn = e.target.querySelector('button[type=submit]');
        if (vBtn.disabled) return;
        vBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        try {
            const resp = await window.api.request('/accounts/access-key/verify/', {
                method: 'POST', noAuth: true, body: JSON.stringify({ access_key: code }),
            });
            if (!resp.valid) { showError(t('auth.access_key_invalid')); return; }
            document.getElementById('ak-welcome').textContent =
                `${t('auth.welcome')}, ${resp.employee.full_name} — ${resp.employee.company}`;
            verifyForm.style.display = 'none';
            redeemForm.style.display = 'block';
            document.getElementById('ak-password').focus();
        } catch (error) {
            showError(t('auth.access_key_invalid'));
        } finally {
            vBtn.disabled = false;
        }
    });

    // Step 2: Set password and activate
    redeemForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const rBtn = e.target.querySelector('button[type=submit]');
        if (rBtn.disabled) return;
        rBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        const password = document.getElementById('ak-password').value;
        try {
            const fpr = window.api.getFingerprint();
            const resp = await window.api.request('/accounts/access-key/redeem/', {
                method: 'POST', noAuth: true,
                body: JSON.stringify({ access_key: code, new_password: password, fingerprint: fpr }),
            });
            window.api.setTokens(resp.tokens.access, resp.tokens.refresh);
            successMsg.style.display = 'flex';
            setTimeout(() => { window.location.href = '/'; }, 800);
        } catch (error) {
            const detail = error.data?.detail
                || (error.data?.new_password && error.data.new_password[0])
                || t('auth.access_key_invalid');
            showError(detail);
            rBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
