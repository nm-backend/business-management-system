{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 28px 24px;">
        <h2 style="text-align: center; margin-bottom: 4px;" data-i18n="setup.title"></h2>
        <p class="text-sm text-muted" style="text-align: center; margin-bottom: 24px;" data-i18n="setup.description"></p>

        <div id="error-message" class="alert-box" style="display: none;"></div>
        <div id="success-message" class="alert-box alert-success" style="display: none;" data-i18n="setup.setup_complete"></div>

        <form id="setup-form">
            <div class="form-group">
                <label for="full_name" data-i18n="setup.full_name"></label>
                <input type="text" id="full_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="phone" data-i18n="setup.phone"></label>
                <input type="text" id="phone" class="form-control">
            </div>
            <div class="form-group">
                <label for="username" data-i18n="auth.username"></label>
                <input type="text" id="username" class="form-control" required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="auth.password"></label>
                <input type="password" id="password" class="form-control" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password_confirm" data-i18n="auth.password_confirm"></label>
                <input type="password" id="password_confirm" class="form-control" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="setup.create_owner"></button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <select id="lang-select" class="form-control" style="width: auto; display: inline-block;">
                <option value="uz_cyrl">Ўзбекча</option>
                <option value="ru">Русский</option>
            </select>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ request.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const langSelect = document.getElementById('lang-select');
    langSelect.value = window.i18n.currentLang;
    langSelect.addEventListener('change', (e) => {
        window.i18n.setLanguage(e.target.value);
    });

    const form = document.getElementById('setup-form');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');
    const getErrorMessage = (error) => {
        const payload = error?.data || {};
        if (payload.detail) return payload.detail;
        for (const value of Object.values(payload)) {
            if (Array.isArray(value) && value.length) return value[0];
            if (typeof value === 'string' && value) return value;
        }
        return window.i18n.translate('common.error');
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const full_name = document.getElementById('full_name').value;
        const phone = document.getElementById('phone').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const password_confirm = document.getElementById('password_confirm').value;

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (password !== password_confirm) {
            errorMsg.textContent = window.i18n.translate('auth.password_mismatch');
            errorMsg.style.display = 'flex';
            return;
        }

        try {
            const data = await window.api.request('/accounts/setup/owner/', {
                method: 'POST',
                body: JSON.stringify({ full_name, phone, username, password, password_confirm }),
                noAuth: true
            });
            // Владелец сразу входит в систему с полученными токенами.
            window.api.setTokens(data.tokens.access, data.tokens.refresh);
            successMsg.style.display = 'flex';
            setTimeout(() => { window.location.href = '/'; }, 800);
        } catch (error) {
            errorMsg.textContent = getErrorMessage(error);
            errorMsg.style.display = 'flex';
        }
    });
});
</script>
{% endblock %}
