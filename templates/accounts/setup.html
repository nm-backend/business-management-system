{% extends 'base.html' %}
{% load static %}

{% block body_class %}auth-body{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-shell">
        <div class="auth-brand">
            <img class="auth-brand-mark" src="{% static 'img/logo.svg' %}" alt="" aria-hidden="true"
                 width="42" height="42">
            <span class="auth-brand-name">SkladPro<span class="auth-brand-suffix">.Nod</span></span>
        </div>

        <div class="auth-card">
            <header class="auth-header">
                <h1 class="auth-title" data-i18n="auth.activate">Активировать и войти</h1>
                <p class="auth-subtitle" data-i18n="auth.access_key_hint"></p>
            </header>

            <div id="error-message" class="auth-error" role="alert" aria-live="assertive"
                 style="display: none;"></div>
            <div id="success-message" class="alert-box alert-success auth-success"
                 style="display: none;" data-i18n="auth.activate"></div>

            <!-- Access Key: step 1 -- verify -->
            <div id="ak-panel">
                <form id="ak-verify-form">
                    <div class="form-group">
                        <label for="ak-code" data-i18n="auth.access_key"></label>
                        <input type="text" id="ak-code" class="form-control auth-key-input"
                               placeholder="SKP-XXXX-XXXX-XXXX" autocomplete="one-time-code"
                               autocapitalize="characters" spellcheck="false" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block auth-submit"
                            data-i18n="auth.continue"></button>
                </form>

                <!-- Access Key: step 2 -- set password -->
                <form id="ak-redeem-form" style="display: none;">
                    <p id="ak-welcome" class="auth-welcome"></p>
                    <div class="form-group">
                        <label for="ak-password" data-i18n="auth.set_password"></label>
                        <input type="password" id="ak-password" class="form-control" required minlength="8"
                               autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block auth-submit"
                            data-i18n="auth.activate"></button>
                </form>
            </div>

            <p class="auth-key-hint u-mt-6" data-i18n="auth.access_key_admin_hint"></p>

            <div class="auth-lang">
                <label for="lang-select" class="sr-only" data-i18n="auth.language"></label>
                <select id="lang-select" class="auth-lang-select">
                    <option value="uz_cyrl">Ўзбекча</option>
                    <option value="ru">Русский</option>
                    <option value="ky">Кыргызча</option>
                </select>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block core_js %}
<script src="{% static 'js/api.js' %}?v={{ ASSET_VERSION }}"></script>
<script src="{% static 'js/i18n.js' %}?v={{ ASSET_VERSION }}"></script>
{% endblock %}

{% block extra_js %}
<script nonce="{{ request.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const t = (k) => window.i18n.translate(k);
    const langSelect = document.getElementById('lang-select');
    langSelect.value = window.i18n.currentLang;
    // Как и на экране входа: явный выбор языка сохраняем при активации,
    // чтобы SPA не вернулся к языку по умолчанию после редиректа.
    let languageChosen = false;
    const selectedLanguage = () => (languageChosen ? langSelect.value : undefined);
    langSelect.addEventListener('change', (e) => {
        languageChosen = true;
        window.i18n.setLanguage(e.target.value);
    });

    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');
    const verifyForm = document.getElementById('ak-verify-form');
    const redeemForm = document.getElementById('ak-redeem-form');
    const showError = (msg) => { errorMsg.textContent = msg; errorMsg.style.display = 'flex'; };
    const clearError = () => { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; };

    // Step 1: Verify access key
    verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        successMsg.style.display = 'none';
        const vBtn = e.target.querySelector('button[type=submit]');
        if (vBtn.disabled) return;
        vBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        try {
            const resp = await window.api.request('/accounts/access-key/verify/', {
                method: 'POST', noAuth: true, body: JSON.stringify({ access_key: code }),
            });
            if (!resp.valid) { showError(t('auth.access_key_invalid')); return; }
            document.getElementById('ak-welcome').textContent =
                `${t('auth.welcome')}, ${resp.employee.full_name} — ${resp.employee.company}`;
            verifyForm.style.display = 'none';
            redeemForm.style.display = 'block';
            document.getElementById('ak-password').focus();
        } catch (error) {
            showError(t('auth.access_key_invalid'));
        } finally {
            vBtn.disabled = false;
        }
    });

    // Step 2: Set password and activate
    redeemForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const rBtn = e.target.querySelector('button[type=submit]');
        if (rBtn.disabled) return;
        rBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        const password = document.getElementById('ak-password').value;
        try {
            const fpr = window.api.getFingerprint();
            const resp = await window.api.request('/accounts/access-key/redeem/', {
                method: 'POST', noAuth: true,
                body: JSON.stringify({
                    access_key: code, new_password: password, fingerprint: fpr,
                    language: selectedLanguage(),
                }),
            });
            window.api.setTokens(resp.tokens.access, resp.tokens.refresh);
            successMsg.style.display = 'flex';
            setTimeout(() => { window.location.href = '/'; }, 800);
        } catch (error) {
            const detail = error.data?.detail
                || (error.data?.new_password && error.data.new_password[0])
                || t('auth.access_key_invalid');
            showError(detail);
            rBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
