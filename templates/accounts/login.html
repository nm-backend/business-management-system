{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 28px 24px;">
        <h2 style="text-align: center; margin-bottom: 4px;" data-i18n="app.name">SkladPro.Nod</h2>
        <p class="text-sm text-muted" style="text-align: center; margin-bottom: 24px;" data-i18n="app.tagline"></p>

        <div id="error-message" class="alert-box" style="display: none;"></div>

        <!-- Обычный вход -->
        <div id="login-panel">
            <form id="login-form">
                <div style="margin-bottom: var(--space-4);">
                    <label for="username" data-i18n="auth.username"></label>
                    <input type="text" id="username" class="input" required autocomplete="username">
                </div>
                <div style="margin-bottom: var(--space-4);">
                    <label for="password" data-i18n="auth.password"></label>
                    <input type="password" id="password" class="input" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.login_button"></button>
            </form>
            <div style="margin-top: 16px; text-align: center;">
                <a href="#" id="show-access-key" class="text-sm" data-i18n="auth.have_access_key"></a>
            </div>
        </div>

        <!-- Активация по Access Key -->
        <div id="access-key-panel" style="display: none;">
            <p class="text-sm text-muted" style="margin-bottom: 16px;" data-i18n="auth.access_key_hint"></p>

            <form id="ak-verify-form">
                <div style="margin-bottom: var(--space-4);">
                    <label data-i18n="auth.access_key"></label>
                    <input type="text" id="ak-code" class="input" placeholder="SKP-XXXX-XXXX-XXXX"
                           autocomplete="one-time-code" required style="text-transform: uppercase; letter-spacing: 1px;">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.continue"></button>
            </form>

            <form id="ak-redeem-form" style="display: none;">
                <p id="ak-welcome" style="margin-bottom: 12px; font-weight: 600;"></p>
                <div style="margin-bottom: var(--space-4);">
                    <label data-i18n="auth.set_password"></label>
                    <input type="password" id="ak-password" class="input" required minlength="8"
                           autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.activate"></button>
            </form>

            <div style="margin-top: 16px; text-align: center;">
                <a href="#" id="show-login" class="text-sm" data-i18n="auth.back_to_login"></a>
            </div>
        </div>

        <div style="margin-top: 24px; text-align: center;">
            <select id="lang-select" class="select" style="width: auto; display: inline-block;">
                <option value="uz_cyrl">Ўзбекча</option>
                <option value="ru">Русский</option>
            </select>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ request.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const t = (k) => window.i18n.translate(k);
    const langSelect = document.getElementById('lang-select');
    langSelect.value = window.i18n.currentLang;
    langSelect.addEventListener('change', (e) => window.i18n.setLanguage(e.target.value));

    const errorMsg = document.getElementById('error-message');
    const loginPanel = document.getElementById('login-panel');
    const akPanel = document.getElementById('access-key-panel');
    const showError = (msg) => { errorMsg.textContent = msg; errorMsg.style.display = 'flex'; };
    const clearError = () => { errorMsg.style.display = 'none'; };

    if (sessionStorage.getItem('session_expired')) {
        showError(t('auth.session_expired'));
        sessionStorage.removeItem('session_expired');
    }

    // ── Обычный вход ──
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const btn = e.target.querySelector('button[type=submit]');
        if (btn.disabled) return;          // защита от двойного клика
        btn.disabled = true;
        try {
            await window.api.login(
                document.getElementById('username').value,
                document.getElementById('password').value,
            );
            window.location.href = '/';    // при успехе уходим со страницы
        } catch (error) {
            showError(error.data?.detail || t('auth.login_error'));
            btn.disabled = false;
        }
    });

    // ── Переключение панелей ──
    document.getElementById('show-access-key').addEventListener('click', (e) => {
        e.preventDefault(); clearError();
        loginPanel.style.display = 'none'; akPanel.style.display = 'block';
    });
    document.getElementById('show-login').addEventListener('click', (e) => {
        e.preventDefault(); clearError();
        akPanel.style.display = 'none'; loginPanel.style.display = 'block';
    });

    // ── Access Key: шаг 1 — проверка кода ──
    const verifyForm = document.getElementById('ak-verify-form');
    const redeemForm = document.getElementById('ak-redeem-form');
    verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault(); clearError();
        const vBtn = e.target.querySelector('button[type=submit]');
        if (vBtn.disabled) return;         // защита от двойного клика
        vBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        try {
            const resp = await window.api.request('/accounts/access-key/verify/', {
                method: 'POST', noAuth: true, body: JSON.stringify({ access_key: code }),
            });
            if (!resp.valid) { showError(t('auth.access_key_invalid')); return; }
            document.getElementById('ak-welcome').textContent =
                `${t('auth.welcome')}, ${resp.employee.full_name} — ${resp.employee.company}`;
            verifyForm.style.display = 'none';
            redeemForm.style.display = 'block';
            document.getElementById('ak-password').focus();
        } catch (error) {
            showError(t('auth.access_key_invalid'));
        } finally {
            vBtn.disabled = false;
        }
    });

    // ── Access Key: шаг 2 — задать пароль и войти ──
    redeemForm.addEventListener('submit', async (e) => {
        e.preventDefault(); clearError();
        // Код одноразовый: двойной клик отправил бы его дважды и «сжёг» попытку.
        const rBtn = e.target.querySelector('button[type=submit]');
        if (rBtn.disabled) return;
        rBtn.disabled = true;
        const code = document.getElementById('ak-code').value.trim().toUpperCase();
        const password = document.getElementById('ak-password').value;
        try {
            const resp = await window.api.request('/accounts/access-key/redeem/', {
                method: 'POST', noAuth: true,
                body: JSON.stringify({ access_key: code, new_password: password }),
            });
            window.api.setTokens(resp.tokens.access, resp.tokens.refresh);
            window.location.href = '/';
        } catch (error) {
            const detail = error.data?.detail
                || (error.data?.new_password && error.data.new_password[0])
                || t('auth.access_key_invalid');
            showError(detail);
            rBtn.disabled = false;   // при успехе не включаем — уходим на '/'
        }
    });
});
</script>
{% endblock %}
