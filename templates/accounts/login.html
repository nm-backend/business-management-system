{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 28px 24px;">
        <h2 style="text-align: center; margin-bottom: 4px;" data-i18n="app.name">SkladPro.Nod</h2>
        <p class="text-sm text-muted" style="text-align: center; margin-bottom: 24px;" data-i18n="app.tagline"></p>

        <div id="error-message" class="alert-box" style="display: none;"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username" data-i18n="auth.username"></label>
                <input type="text" id="username" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="auth.password"></label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.login_button"></button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <select id="lang-select" class="form-control" style="width: auto; display: inline-block;">
                <option value="uz_cyrl">Ўзбекча</option>
                <option value="ru">Русский</option>
            </select>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const langSelect = document.getElementById('lang-select');
    langSelect.value = window.i18n.currentLang;
    langSelect.addEventListener('change', (e) => {
        window.i18n.setLanguage(e.target.value);
    });

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-message');
    if (sessionStorage.getItem('session_expired')) {
        errorMsg.textContent = window.i18n.translate('auth.session_expired');
        errorMsg.style.display = 'flex';
        sessionStorage.removeItem('session_expired');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        errorMsg.style.display = 'none';

        try {
            await window.api.login(username, password);
            window.location.href = '/';
        } catch (error) {
            errorMsg.textContent = error.data?.detail || window.i18n.translate('auth.login_error');
            errorMsg.style.display = 'flex';
        }
    });
});
</script>
{% endblock %}
