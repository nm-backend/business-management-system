<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Страница не найдена</title>
	<style>
		body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
		.container{width:100%;max-width:500px;box-sizing:border-box;text-align:center;background:white;padding:40px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
		h1{font-size:72px;margin:0 0 20px;color:#667eea}p{font-size:18px;color:#666;margin:0 0 30px}.detail{font-size:14px;color:#999}
		a{display:inline-block;padding:12px 32px;background:#667eea;color:white;text-decoration:none;border-radius:6px;font-weight:600;transition:background .3s}a:hover{background:#764ba2}
		@media(max-width:480px){.container{padding:32px 24px}}
	</style>
</head>
<body><main class="container"><h1>404</h1><p>Страница не найдена</p><p class="detail">Извините, запрашиваемая страница не существует.</p><a href="/">На главную страницу</a></main></body>
</html>
