<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{ copy.not_found_title }}</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: #e5e5ea;
            --accent: #0071e3;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --muted: #98989f;
                --line: #333336;
                --accent: #0a84ff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.06);
        }
        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 8px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            line-height: 1.2;
            font-weight: 650;
            letter-spacing: -0.03em;
        }
        p {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 22px;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        a:hover { filter: brightness(1.06); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">404</p>
        <h1>{{ copy.not_found_title }}</h1>
        <p>{{ copy.not_found_detail }}</p>
        <a href="/">{{ copy.back_to_home }}</a>
    </main>
</body>
</html>
