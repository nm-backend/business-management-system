<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>500 — SkladPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 4px 16px rgba(29,29,31,.08);border:1px solid #e5e5ea}
.eyebrow{color:#0071e3;font-weight:700;letter-spacing:.12em;font-size:13px;margin-bottom:4px}
h1{font-size:22px;font-weight:700;margin:8px 0 12px;line-height:1.3}
p{color:#6e6e73;font-size:14px;line-height:1.5;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border:1px solid transparent;border-radius:980px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit;line-height:1.2;text-decoration:none;background:#0071e3;color:#fff;transition:background .18s}
.btn:hover{background:#0077ed}
</style>
</head>
<body>
<div class="card">
<p class="eyebrow">500</p>
<h1>Something went wrong</h1>
<p>We are sorry, but the server could not complete your request. Our team has been notified.</p>
<a class="btn" href="/">Return home</a>
</div>
</body>
</html>
