plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skladpro.demo'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.skladpro.demo"
        minSdk 26          // adaptive-иконки без PNG-фолбэков (Android 8.0+)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Демо: без обфускации, но это release-сборка (debuggable=false по умолчанию).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Зависимостей нет намеренно: чистый android.webkit.WebView без androidx —
// меньше внешних артефактов, устойчивее сборка.
