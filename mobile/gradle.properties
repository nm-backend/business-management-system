org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# В SDK установлен только platform android-36; AGP 8.7 официально знает до 35 —
# подавляем предупреждение, чтобы собирать против установленного compileSdk 36.
android.suppressUnsupportedCompileSdk=36
