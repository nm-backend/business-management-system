# ── SkladPro.Nod — PRODUCTION-профиль ────────────────────────────────────────
# Отличия от docker-compose.yml (dev):
#   • DJANGO_ENV=production, DEBUG=False — включаются fail-closed-гарды settings.
#   • Секреты ОБЯЗАТЕЛЬНЫ: ${VAR:?...} — compose откажется стартовать без них
#     (никаких «dev-insecure» ключей по умолчанию, в отличие от dev-стека).
#   • Код НЕ монтируется с хоста — образ самодостаточен (COPY . . в Dockerfile).
#   • ALLOWED_HOSTS задаёте вы; '*' в проде запрещён гардом production.py.
#
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# .env.prod ДОЛЖЕН задавать: SECRET_KEY, ALLOWED_HOSTS, DB_PASSWORD, REDIS_PASSWORD.
# HTTPS/SSL терминирует reverse-proxy (nginx/Caddy/Traefik) НА ХОСТЕ:
# порт приложения опубликован только на 127.0.0.1, из другой docker-сети
# до него не достучаться. Готовый конфиг — deploy/nginx.conf.

# Общее окружение приложения для web/worker/beat (YAML-якорь: переменные не
# расходятся между сервисами — иначе воркер молча работает с другой БД/брокером).
x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production (generate a long random one)}
  DJANGO_ENV: production
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required in production (comma-separated, no '*')}
  DB_NAME: ${DB_NAME:-skladpro_db}
  DB_USER: ${DB_USER:-skladpro}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}@redis:6379/0
  # Django за reverse-proxy: доверяем X-Forwarded-Proto для HTTPS-редиректа.
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  # Раздача медиафайлов через защищённое view Django (apps/core/media_views.py)
  MEDIA_SERVE: ${MEDIA_SERVE:-True}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-skladpro_db}
      POSTGRES_USER: ${DB_USER:-skladpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skladpro} -d ${DB_NAME:-skladpro_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    # Единый тег для web/worker/beat: без него compose собирает три отдельных
    # образа и пересборка одного оставляет остальные на старом коде.
    image: skladpro-app:latest
    command: daphne -b 0.0.0.0 -p 8000 skladpro.asgi:application
    environment: *app-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # Только loopback: снаружи доступен исключительно nginx с TLS.
    # Публичный 0.0.0.0:8000 отдавал бы Django в обход прокси.
    ports:
      - "127.0.0.1:8000:8000"
    # Probe шлёт Host из ALLOWED_HOSTS и X-Forwarded-Proto=https, иначе под
    # production настройками loopback-запрос падает на DisallowedHost/SSL-redirect
    # и контейнер навсегда 'unhealthy'. Логика — в docker/healthcheck.py.
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery worker: выполняет фоновые задачи (авто-бэкап БД в S3/Telegram) ──
  # Без этого сервиса расписания в БД создаются, но задачи НЕ выполняются.
  # Ждём web healthy: миграции применяет entrypoint web (у worker SKIP_INIT=1).
  worker:
    build: .
    image: skladpro-app:latest
    command: celery -A skladpro worker -l info --concurrency=2
    environment:
      <<: *app-env
      SKIP_INIT: "1"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A skladpro inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery beat: планировщик (расписания хранятся в БД: django-celery-beat) ──
  beat:
    build: .
    image: skladpro-app:latest
    command: celery -A skladpro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *app-env
      SKIP_INIT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
