# ── SkladPro.Nod — полный стек одной командой: docker compose up --build ──
# Сервисы: web (Django+Channels/ASGI), worker+beat (Celery: автобэкап),
#          db (PostgreSQL), redis (канальный слой + брокер Celery).
# Значения по умолчанию заданы прямо здесь — новый разработчик может запустить
# без .env. Для переопределения создайте .env рядом с этим файлом.

# Общее окружение приложения: используется web, worker и beat (YAML-якорь,
# чтобы переменные не расходились между сервисами).
x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DEBUG: ${DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
  DB_NAME: ${DB_NAME:-skladpro_db}
  DB_USER: ${DB_USER:-skladpro}
  DB_PASSWORD: ${DB_PASSWORD:-skladpro}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://:${REDIS_PASSWORD:-skladpro_redis_pass}@redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-skladpro_db}
      POSTGRES_USER: ${DB_USER:-skladpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skladpro}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skladpro} -d ${DB_NAME:-skladpro_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis работал без пароля: любой, кто попал во внутреннюю сеть (например,
    # через RCE в web), получал полный доступ. Порт наружу не проброшен, но
    # пароль — необходимый второй рубеж (defence in depth).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-skladpro_redis_pass}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-skladpro_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    # Единый тег образа для web/worker/beat: иначе compose собирает ТРИ разных
    # образа, и `build web` оставляет worker/beat на устаревшем коде
    # (воспроизведено: worker падал с ModuleNotFoundError после смены requirements).
    image: skladpro-app:latest
    command: daphne -b 0.0.0.0 -p 8000 skladpro.asgi:application
    environment: *app-env
    volumes:
      - .:/app                 # dev: код с хоста (перезапуск web применяет изменения)
      - media_data:/app/media       # загруженные файлы
      - static_data:/app/staticfiles  # собранная статика (WhiteNoise)
    ports:
      - "8000:8000"
    # У web не было healthcheck: оркестратор считал контейнер «живым», даже если
    # приложение внутри упало. Проверяем реальный ответ приложения.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/accounts/setup/check/', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery worker: выполняет фоновые задачи (резервное копирование БД) ──
  # Без этого сервиса PeriodicTask'и создаются в БД, но НИКОГДА не выполняются —
  # автобэкап был бы декоративным. SKIP_INIT=1: миграции/статику делает web.
  worker:
    build: .
    image: skladpro-app:latest       # тот же образ, что и web
    command: celery -A skladpro worker -l info --concurrency=2
    environment:
      <<: *app-env
      SKIP_INIT: "1"
    volumes:
      - .:/app
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A skladpro inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Ждём web (а не только db): миграции применяет entrypoint web, а воркеру
    # нужны таблицы django_celery_results/beat — иначе гонка и падение старта.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery beat: планировщик (расписания берутся из БД через django-celery-beat) ──
  beat:
    build: .
    image: skladpro-app:latest       # тот же образ, что и web
    command: celery -A skladpro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *app-env
      SKIP_INIT: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
